<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curb — Blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1D26; --paper:#F8F6F0; --line:#D6CDB8; --ink-soft:#5B5648; --clay-deep:#96633C;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; min-height:100vh;
  }
  .wrap{ max-width:480px; padding:0 32px; text-align:center; }
  .logo{ font-family:'Newsreader', serif; font-style:italic; font-weight:500; font-size:22px; margin-bottom:32px; }
  h1{ font-family:'Newsreader', serif; font-weight:500; font-size:32px; margin:0 0 16px; }
  p{ color:var(--ink-soft); font-size:15.5px; line-height:1.6; margin:0 0 28px; }
  a.home{ font-family:'Inter'; font-weight:600; font-size:13.5px; color:var(--clay-deep); text-decoration:none; border-bottom:1px solid var(--clay-deep); padding-bottom:1px; }
  a.home:hover{ color:var(--ink); border-color:var(--ink); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">Curb</div>
    <h1>Blog — coming soon</h1>
    <p>This is a placeholder. Nothing published yet.</p>
    <a class="home" href="../index.html">&larr; Back to curb.exchange</a>
  </div>
</body>
</html>
